[project]
name = "mcp-ntp"
version = "0.3.0"
description = "MCP-based NTP Time Service"
authors = [
    { name = "Scofield Guo", email = "guozhi5658@gmail.com" }
]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.15"
urls = { Homepage = "https://github.com/scofield5658/mcp-ntp" }
dependencies = [
    "fastapi>=0.116,<1",
    "mcp==2.2.0",
    "uvicorn>=0.35,<1",
    "requests>=2.32,<3",
    "python-dotenv>=1,<2",
    "click>=8,<9",
    "ntplib>=0.4,<1"
]

[project.scripts]
mcp-ntp = "app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "twine>=7,<8",
    "pytest>=8,<9",
]
